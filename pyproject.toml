[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "NeuRiPP"
authors = [
  {name = "Vitalii Aksenov", email = "viviaxenov@gmail.com"},
  {name = "Sebastian Gutierrez", email = "shern3@gmail.com"},
]
readme = 'README.md'
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
  "flax==0.12.8",
  "jax==0.11.0",
  "jaxtyping>=0.3.2",
  "optax>=0.2.6",
]

[project.optional-dependencies]
cuda12 = [
  "jax[cuda12]==0.11.0",
]
cuda13 = [
  "jax[cuda13]==0.11.0",
]
examples = [
  "numpy",
  "matplotlib>=3.10.6",
  "tqdm>=4.67.1",
  "datasets[vision]>=5.0.0",
  "orbax-checkpoint>=0.11.31",
  "pandas>=2.2",
  "h5py>=3.11",
  "bip-surrogates-paper @ git+https://github.com/viviaxenov/Bayesian-inference-with-surrogates.git",
]
image-benchmarks = [
  "datasets[vision]>=5.0.0",
  "orbax-checkpoint>=0.11.31",
  "pillow>=10",
  "scipy>=1.13",
  "ml-collections>=1.0",
  "transformers>=4.42",
  "google-cloud-storage>=2.18",
  "matplotlib>=3.10.6",
  "tqdm>=4.67.1",
  "torch>=2.5",
  "torchvision>=0.20",
]
image-benchmarks-diffuse = [
  "datasets[vision]>=5.0.0",
  "orbax-checkpoint>=0.11.31",
  "pillow>=10",
  "scipy>=1.13",
  "ml-collections>=1.0",
  "transformers>=4.42",
  "google-cloud-storage>=2.18",
  "matplotlib>=3.10.6",
  "tqdm>=4.67.1",
  "torch>=2.5",
  "torchvision>=0.20",
  "diffuse-nnx[vae,eval] @ git+https://github.com/viviaxenov/diffuse_nnx.git@da5f2b79497722931d279b012c90bec61050466b",
]
docs = [
  "sphinx",
  "sphinx_rtd_theme",
  "nbsphinx",
  "pandoc",
  "ipython",
  ]
